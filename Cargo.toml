[package]
name = "blrec"
version = "0.1.0"
edition = "2024"
description = "Record audio from Bilibili live streams"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "io-util", "io-std", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
clap = { version = "4.5", features = ["cargo", "wrap_help", "derive"] }
api_req = { version = "0.5", features = ["cookies"] }
reqwest = { version = "0.13", features = ["stream"] }
cookie = "0.18"
url = { version = "2.5", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
ffmpeg-next = { version = "8", default-features = false, features = ["codec", "format", "software-resampling"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["clock"] }
sanitize-filename = "0.6"
